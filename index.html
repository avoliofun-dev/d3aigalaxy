<!doctype html>

<title>Galaxy AI Agent — Ruang 3D Galaxy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap">
<style>
:root{color-scheme:dark;--bg:#05060f;--b1:#1c0b52;--b2:#04334d;--ink:#eaf0ff;--mute:#8d97c4;--glass:rgba(10,12,34,.62);--gb:rgba(120,140,255,.3);--edge:#3a4690;--lnk:#8fe9ff;--sh:0 0 0 1px rgba(120,140,255,.1),0 14px 44px rgba(0,0,0,.65);--team:#19e3ff;--process:#ff9f1a;--data:#ff2e93;--gov:#8b5cff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 600px at 12% 0%,var(--b1),transparent 70%),radial-gradient(800px 600px at 100% 100%,var(--b2),transparent 70%),var(--bg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;pointer-events:none}
header>*{pointer-events:auto}
h1{font:600 24px/1.15 Sora,Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:4px 0 0;text-shadow:0 0 22px rgba(139,92,255,.65)}
h1 small{display:block;font:400 13px/1.45 Inter,system-ui,sans-serif;letter-spacing:0;color:var(--mute);margin-top:5px;max-width:38ch}
.glass,.act,.chips button,#ans,aside,.row input,.modal-box{background:var(--glass);border:1px solid var(--gb);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
.act,.chips button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s,background .15s}
.act:hover,.chips button:hover{transform:translateY(-1px);border-color:var(--lnk);box-shadow:0 0 18px rgba(25,227,255,.35)}
.act[aria-pressed="false"]{opacity:.6}
.act.auth-pill{background:linear-gradient(135deg,rgba(139,92,255,.35),rgba(25,227,255,.35));border-color:var(--lnk)}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button:focus-visible,input:focus-visible,select:focus-visible,.lnk:focus-visible{outline:2px solid var(--lnk);outline-offset:2px}
#ask{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(680px,calc(100% - 24px));z-index:4;display:flex;flex-direction:column;gap:10px}
body.pn #ask{display:none}
#ans{border-radius:20px;padding:14px 16px;max-height:38vh;overflow:auto;box-shadow:var(--sh)}
#ans[hidden]{display:none}
#at{margin:0 0 10px;white-space:pre-wrap;font-size:14px;line-height:1.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px}
.chips button{flex:none;font-weight:500}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font:inherit;color:var(--ink);border-radius:999px;padding:12px 18px;box-shadow:var(--sh)}
.row input::placeholder{color:var(--mute)}
.row .act{background:linear-gradient(135deg,#19e3ff,#8b5cff 55%,#ff2e93);color:#05061a;border:0;padding:10px 22px;box-shadow:0 0 22px rgba(139,92,255,.5)}
.row .act:disabled{opacity:.5}
aside{position:fixed;top:12px;right:12px;bottom:12px;width:350px;max-width:calc(100% - 24px);border-radius:22px;box-shadow:var(--sh);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 50px) 20px 20px;z-index:6;transform:translateX(115%);visibility:hidden;transition:transform .28s,visibility .28s}
aside.open{transform:none;visibility:visible}
aside h2{font:600 20px/1.2 Sora,Inter,sans-serif;letter-spacing:-.01em;margin:0 0 4px}
.badge{font-size:13px;color:var(--mute);margin-bottom:12px}
pre{font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.14);border:1px solid var(--gb);border-radius:14px;padding:14px;margin:0 0 14px;white-space:pre-wrap;overflow-x:auto}
.lnk,.lnk2{color:var(--lnk);cursor:pointer;text-decoration:underline;background:none;border:0;font:inherit;padding:0}
p.note{margin:0 0 12px;color:var(--mute);font-size:14px}
.warn{border-left:3px solid var(--data);background:rgba(238,79,134,.1);border-radius:0 10px 10px 0;padding:8px 12px;font-size:14px;margin-bottom:12px}
.fm label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.fm input,.fm select,.fm textarea{width:100%;font:inherit;color:var(--ink);background:rgba(0,0,0,.12);border:1px solid var(--gb);border-radius:12px;padding:9px 12px}
.fm select option{color:#1a1f3a}
#tools{position:fixed;left:18px;top:calc(env(safe-area-inset-top,0px) + 118px);z-index:4;display:flex;flex-direction:column;gap:8px;width:min(270px,calc(100% - 36px))}
#sq,.lg{background:var(--glass);border:1px solid var(--gb);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);box-shadow:var(--sh)}
#sq{width:100%;font:inherit;font-size:14px;color:var(--ink);border-radius:999px;padding:9px 16px}
#sq::placeholder{color:var(--mute)}
#leg{display:flex;flex-wrap:wrap;gap:6px}
.lg{font:inherit;font-size:12px;font-weight:500;color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.pb{display:flex;gap:8px;flex-wrap:wrap}
.fm textarea{resize:vertical}
.tb{display:flex;flex-wrap:wrap;gap:6px}
.act.sm{font-size:12px;padding:5px 11px}
.act:disabled{opacity:.4;cursor:default;transform:none;box-shadow:var(--sh)}
ul.el{padding-left:18px;margin:8px 0 12px;font-size:14px}
ul.el li{margin-bottom:6px}
.lnk2:focus-visible,.lg:focus-visible,#sq:focus-visible{outline:2px solid var(--lnk);outline-offset:2px}
#mn,#tm{display:none}
#more{display:flex;flex-direction:column;gap:8px}

/* Modal Glass */
.modal-overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:18px;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.modal-overlay.open{visibility:visible;opacity:1}
.modal-box{width:min(420px,100%);border-radius:24px;padding:24px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:14px}
.modal-tabs{display:flex;gap:8px;border-bottom:1px solid var(--gb);padding-bottom:8px}
.modal-tab{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:4px 10px}
.modal-tab.active{color:var(--lnk);font-weight:600;border-bottom:2px solid var(--lnk)}
.modal-err{font-size:13px;color:#ff6b8b;background:rgba(255,46,147,.12);padding:8px 12px;border-radius:8px;border:1px solid rgba(255,46,147,.3);display:none}

@media (max-width:720px){
#tools{top:calc(env(safe-area-inset-top,0px) + 60px)}
body.pn #tools{display:none}
h1 small{display:none}
header{align-items:center}
#mn,#tm{display:inline-block}
#tm{align-self:flex-start}
.bar{display:none;position:absolute;right:18px;top:calc(env(safe-area-inset-top,0px) + 56px);flex-direction:column;align-items:stretch;gap:6px;padding:10px;border-radius:16px;background:var(--glass);border:1px solid var(--gb);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--sh)}
header.open .bar{display:flex}
#more{display:none}
#tools.open #more{display:flex}
#chips{display:none}

html.dk h1{font-size:24px}
html.dk h1 small{display:block}
html.dk header{align-items:flex-start}
html.dk #mn,html.dk #tm{display:none}
html.dk .bar{display:flex;position:static;flex-direction:row;align-items:normal;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
html.dk #tools{top:calc(env(safe-area-inset-top,0px) + 118px)}
html.dk body.pn #tools{display:flex}
html.dk #more{display:flex}
html.dk #chips{display:flex}
html.dk aside{top:12px;left:auto;right:12px;bottom:12px;width:350px;max-width:calc(100% - 24px);max-height:none;padding-top:calc(env(safe-area-inset-top,0px) + 50px);transform:translateX(115%)}

</style>

<body>
<canvas id="c" aria-label="Graf ruang 3D Galaxy AI"></canvas>
<header>
  <h1>Galaxy AI Agent<small>Seret bubble untuk memindahkan, seret latar untuk memutar. Dua jari/klik kanan untuk geser. Gulir untuk zoom.</small></h1>
  <button class="act" id="mn" aria-expanded="false">Menu</button>
  <div class="bar">
    <button class="act auth-pill" id="authBtn">Masuk / Akun</button>
    <button class="act sm" id="rst" title="Pulihkan graf ke default Versi 1.0">Reset v1.0</button>
    <button class="act sm" id="add">Tambah</button>
    <button class="act sm" id="chk">Periksa</button>
    <button class="act sm" id="exp" title="Ekspor sebagai folder Markdown (zip)">Ekspor</button>
    <button class="act sm" id="exj" title="Simpan cadangan graf sebagai JSON">JSON</button>
    <button class="act sm" id="imb" title="Impor graf dari file JSON">Impor</button>
    <button class="act sm" id="fsc" title="Layar penuh">Layar penuh</button>
    <button class="act sm" id="dk" aria-pressed="false" title="Paksa tata letak desktop">Desktop</button>
    <button class="act sm" id="mot" aria-pressed="true">Hentikan gerak</button>
  </div>
</header>

<div id="tools">
  <input id="sq" type="search" placeholder="Cari bubble…" aria-label="Cari bubble" autocomplete="off">
  <button class="act sm" id="tm" aria-expanded="false">Filter dan alat</button>
  <div id="more">
    <div id="leg"></div>
    <div class="tb">
      <button class="act sm" id="und" title="Urungkan (Ctrl+Z)">Urungkan</button>
      <button class="act sm" id="red" title="Ulangi (Ctrl+Shift+Z)">Ulangi</button>
      <button class="act sm" id="sum">Ringkasan</button>
      <button class="act sm" id="ctr" title="Kembalikan tampilan ke tengah">Pusatkan</button>
      <button class="act sm" id="rel" title="Susun ulang posisi semua bubble">Tata ulang</button>
      <button class="act sm" id="bal" title="Jadikan semua field tiap bubble sebagai cabang">Cabangkan semua</button>
      <button class="act sm" id="tgl">Buka/tutup cabang</button>
    </div>
  </div>
</div>

<input type="file" id="imp" accept=".json,application/json" hidden>
<aside id="panel" aria-live="polite"></aside>

<!-- Area Tanya AI Galaxy di bagian bawah tengah (Sleek Bottom Bar) -->
<div id="ask">
  <div id="ans" hidden>
    <p id="at"></p>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button class="act sm" id="ax">Tutup jawaban</button>
    </div>
  </div>
  <div id="qrow">
    <div class="chips" id="chips"></div>
    <div class="row">
      <input id="q" placeholder="Tanya Galaxy AI, mis. apa rencana proyek Be A Leader?" aria-label="Pertanyaan ke Galaxy AI">
      <button class="act" id="go">Tanya</button>
    </div>
  </div>
</div>

<!-- Modal Autentikasi Supabase -->
<div class="modal-overlay" id="authModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font:600 19px Sora,sans-serif;margin:0;">Akun Galaxy AI</h2>
      <button class="act sm" id="closeAuthModal">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tabLogin">Masuk</button>
      <button class="modal-tab" id="tabRegister">Daftar</button>
    </div>
    <div class="modal-err" id="modalErr"></div>
    <div id="authFormArea">
      <div class="fm">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" placeholder="nama@email.com">
        <label for="authPassword">Kata Sandi</label>
        <input type="password" id="authPassword" placeholder="Minimal 6 karakter">
      </div>
      <div style="margin-top:14px;display:flex;justify-content:flex-end;">
        <button class="act primary" id="authSubmitBtn">Masuk</button>
      </div>
    </div>
    <div id="loggedInArea" style="display:none;">
      <p style="font-size:14px;margin:0 0 14px;" id="loggedInUserText">Anda sedang login.</p>
      <div style="display:flex;justify-content:flex-end;">
        <button class="act" id="logoutBtn">Keluar (Logout)</button>
      </div>
    </div>
  </div>
</div>

  else {
    g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + h - r);

    g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r);

async function ask(q){
 q=q.trim();if(!q||busy)return;
 
 if (!currentUser || !currentToken) {
   openAuthModal();
   showAuthErr("Silakan Masuk atau Daftarkan akun terlebih dahulu untuk berdialog dengan Galaxy AI.");
   return;
 }

 busy=1;go.disabled=true;select(null);show("Galaxy sedang berpikir...");
 
 try {
   var resp = await fetch('/api/chat', {
     method: 'POST',
     headers: {
       'Content-Type': 'application/json',
       'Authorization': 'Bearer ' + currentToken
     },
     body: JSON.stringify({ message: q })
   });

   var data = await resp.json();
   if (!resp.ok) throw new Error(data.error || "Gagal menghubungi Galaxy AI");

   var t = data.reply;
   show(t);

   // Sorot node terkait jika ada nama bubble yang cocok di dalam jawaban
   var matched = [];
   nodes.forEach(function(n){
     if (t.toLowerCase().indexOf(n.label.toLowerCase()) >= 0) matched.push(n.id);
   });
   if (matched.length) {
     lit = matched.slice(0, 6);
     paint();
     var c = new V();
     lit.forEach(function(i){ if(byId[i]) c.add(byId[i].p); });
     goal.copy(c.divideScalar(lit.length));
     radG = rad0 * .75;
   }
 } catch(e) {
   show("Terjadi kesalahan: " + (e.message || "Gagal memproses jawaban."));
 }
 busy=0;go.disabled=false;
}

var authModal = document.getElementById("authModal");
var modalErr = document.getElementById("modalErr");

function openAuthModal() {
  authModal.classList.add("open");
  hideAuthErr();
  if (currentUser) {
    document.getElementById("authFormArea").style.display = "none";
    document.getElementById("loggedInArea").style.display = "block";
    document.getElementById("loggedInUserText").innerHTML = "Login sebagai: <strong>" + currentUser.email + "</strong>";
  } else {
    document.getElementById("authFormArea").style.display = "block";
    document.getElementById("loggedInArea").style.display = "none";
    setAuthTab("tabLogin");
  }
}
function closeAuthModal() { authModal.classList.remove("open"); }
function showAuthErr(msg) { modalErr.textContent = msg; modalErr.style.display = "block"; }
function hideAuthErr() { modalErr.style.display = "none"; }

function setAuthTab(tabId) {
  hideAuthErr();
  document.querySelectorAll(".modal-tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById(tabId).classList.add("active");
  document.getElementById("authSubmitBtn").textContent = (tabId === "tabRegister" ? "Daftar Akun" : "Masuk");
}

document.getElementById("authBtn").onclick = openAuthModal;
document.getElementById("closeAuthModal").onclick = closeAuthModal;
document.getElementById("tabLogin").onclick = function(){ setAuthTab("tabLogin"); };
document.getElementById("tabRegister").onclick = function(){ setAuthTab("tabRegister"); };

document.getElementById("authSubmitBtn").onclick = async function(){
  if (!sbClient) { showAuthErr("Koneksi Supabase belum aktif."); return; }
  var em = document.getElementById("authEmail").value.trim();
  var pw = document.getElementById("authPassword").value;
  if (!em || !pw) { showAuthErr("Email dan kata sandi wajib diisi."); return; }

  var isReg = document.getElementById("tabRegister").classList.contains("active");
  hideAuthErr();

  if (isReg) {
    var r = await sbClient.auth.signUp({ email: em, password: pw });
    if (r.error) showAuthErr(r.error.message);
    else {
      alert("Pendaftaran berhasil! Silakan periksa konfirmasi email jika ada, atau langsung masuk.");
      closeAuthModal();
    }
  } else {
    var r2 = await sbClient.auth.signInWithPassword({ email: em, password: pw });
    if (r2.error) showAuthErr(r2.error.message);
    else {
      currentUser = r2.data.user;
      currentToken = r2.data.session ? r2.data.session.access_token : null;
      updateAuthBtn();
      closeAuthModal();
    }
  }
};

document.getElementById("logoutBtn").onclick = async function(){
  if (sbClient) await sbClient.auth.signOut();
  currentUser = null; currentToken = null;
  updateAuthBtn(); closeAuthModal();
};

document.getElementById("rst").onclick = function(){
  try { localStorage.removeItem("galaxy_v1_graph"); localStorage.removeItem("brain3d"); } catch(e){}
  location.reload();

function branchify(n,k){var t=TPL[k];if(!t)return [];
 var keys=t[3].slice();Object.keys(n.props).forEach(function(q){if(q!=="sensitivity"&&keys.indexOf(q)<0)keys.push(q)});
 var have={};nodes.forEach(function(x){if(x.par===n.id&&x.props.field)have[x.props.field]=1});
 var todo=keys.filter(function(f){return !have[f]}),m=todo.length,out=[];
 todo.forEach(function(f,i){var v=n.props[f]||"",id=n.id+"-"+slug(f);while(byId[id])id+="-2";
  var y=m>1?1-2*(i+.5)/m:0,r=Math.sqrt(1-y*y),a=i*2.399,
  o={id:id,label:v?f+": "+v:f,type:n.type,props:{field:f,nilai:v},desc:"Field "+f+" dari "+n.label+".",par:n.id,tpl:null,p:n.p.clone().add(new V(Math.cos(a)*r,y,Math.sin(a)*r).multiplyScalar(70)),f:new V(),deg:0,pu:1};
  if(n.props.sensitivity==="sensitive")o.props.sensitivity="sensitive";
  delete n.props[f];byId[id]=o;nodes.push(o);edges.push({a:n,b:o,verb:"punya"});out.push(o)});
 n.tpl=k;return out}

function findPath(){var a=sel,b=byId[gv("pt")];if(!a||!b)return;
 var prev={},q=[a],seen={};seen[a.id]=1;
 while(q.length&&!seen[b.id]){var u=q.shift();edges.forEach(function(e){var v=e.a===u?e.b:(e.b===u?e.a:null);if(v&&!seen[v.id]){seen[v.id]=1;prev[v.id]={u:u,e:e};q.push(v)}})}
 select(null);
 if(!seen[b.id]){show("Tidak ada jalur antara "+a.label+" dan "+b.label+".");return}
 var steps=[],ids=[b.id],c=b;while(c!==a){var p=prev[c.id];steps.unshift(p.e.a===p.u?p.u.label+" "+p.e.verb+" "+c.label:c.label+" "+p.e.verb+" "+p.u.label);ids.unshift(p.u.id);c=p.u}
 show("Jalur terpendek ("+steps.length+" langkah):\n- "+steps.join("\n- "));
 lit=ids;paint();var m=new V();ids.forEach(function(i){m.add(byId[i].p)});goal.copy(m.divideScalar(ids.length));radG=rad0*.75}

function parseGraph(j){
 if(!j||!Array.isArray(j.N)||!Array.isArray(j.E))return null;
 var ids=Object.create(null),Nn=[];
 j.N.forEach(function(q){
  if(!Array.isArray(q)||typeof q[0]!=="string"||!q[1]||ids[q[0]])return;
  ids[q[0]]=1;
  Nn.push([q[0],q[1].trim(),fixType(q[0],q[2]),q[3]||{},q[4]||"",q[5]||null,q[6]||null]);
 });
 if(!Nn.length)return null;
 var En=j.E.filter(function(q){return Array.isArray(q)&&ids[q[0]]&&ids[q[1]]}).map(function(q){return [q[0],q[1],q[2]||"terhubung ke"]});
 return {N:Nn,E:En};
}

function loadGraph(Nn,En){
 nodes.forEach(function(n){if(n.spr){S.remove(n.spr);n.spr.material.map.dispose();n.spr.material.dispose()}});
 byId={};
 nodes=Nn.map(function(q,i){var y=1-2*(i+.5)/Nn.length,r=Math.sqrt(1-y*y),a=i*2.399,o={id:q[0],label:q[1],type:q[2],props:q[3],desc:q[4],par:q[5]||null,tpl:q[6]||null,p:new V(Math.cos(a)*r*120,y*120,Math.sin(a)*r*120),f:new V(),deg:0,pu:0};byId[o.id]=o;return o});
 edges=En.map(function(q){var a=byId[q[0]],b=byId[q[1]];if(!a||!b)return null;var x={a:a,b:b,verb:q[2]};x.a.deg++;x.b.deg++;return x}).filter(Boolean);
 for(var it=0;it<400;it++){nodes.forEach(function(n){n.f.set(0,0,0)});
  for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){var a=nodes[i],b=nodes[j];d.copy(a.p).sub(b.p);var l=d.length()+.1;d.multiplyScalar(9000/(l*l)/l);a.f.add(d);b.f.sub(d)}
  edges.forEach(function(e){d.copy(e.b.p).sub(e.a.p);var l=d.length()+.1;d.multiplyScalar((l-(e.b.par===e.a.id||e.a.par===e.b.id?48:130))*.05/l);e.a.f.add(d);e.b.f.sub(d)});
  nodes.forEach(function(n){n.f.addScaledVector(n.p,-.02);n.p.add(n.f.clampLength(0,10))})}
 nodes.forEach(mk);degs();buildEdges();select(null)}
