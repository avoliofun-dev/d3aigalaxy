<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxy AI Agent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#05060f;--b1:#1c0b52;--b2:#04334d;--ink:#eaf0ff;--mute:#8d97c4;
  --glass:rgba(10,12,34,.62);--gb:rgba(120,140,255,.3);--edge:#3a4690;--lnk:#8fe9ff;
  --sh:0 0 0 1px rgba(120,140,255,.1),0 14px 44px rgba(0,0,0,.65);
  --team:#19e3ff;--process:#ff9f1a;--data:#ff2e93;--gov:#8b5cff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  color:var(--ink);
  font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(900px 600px at 12% 0%,var(--b1),transparent 70%),
             radial-gradient(800px 600px at 100% 100%,var(--b2),transparent 70%),
             var(--bg);
}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:1}

/* Header */
header{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0;
  pointer-events:none;
}
header>*{pointer-events:auto}
h1{
  font:600 22px/1.2 Sora,Inter,sans-serif;letter-spacing:-.02em;margin:0;
  text-shadow:0 0 24px rgba(139,92,255,.65);
}
.glass,.act,.chips button,#ans,aside,.row input,.modal-box{
  background:var(--glass);border:1px solid var(--gb);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
}
.act,.chips button{
  font:inherit;font-size:13px;font-weight:600;color:var(--ink);
  border-radius:999px;padding:7px 16px;cursor:pointer;
  box-shadow:var(--sh);transition:transform .15s,background .15s,border-color .15s;
}
.act:hover,.chips button:hover{
  transform:translateY(-1px);border-color:var(--lnk);box-shadow:0 0 18px rgba(25,227,255,.35);
}
.act.auth-pill{
  background:linear-gradient(135deg,rgba(139,92,255,.4),rgba(25,227,255,.4));
  border-color:var(--lnk);
}
.act.primary{
  background:linear-gradient(135deg,#19e3ff,#8b5cff 55%,#ff2e93);
  color:#05061a;border:0;box-shadow:0 0 22px rgba(139,92,255,.5);
}
.bar{display:flex;gap:8px;align-items:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--lnk);outline-offset:2px}

/* Search bar di kiri atas */
#tools{
  position:fixed;left:20px;top:calc(env(safe-area-inset-top,0px) + 70px);
  z-index:5;display:flex;flex-direction:column;gap:8px;width:min(240px,calc(100% - 40px));
}
#sq{
  width:100%;font:inherit;font-size:13.5px;color:var(--ink);
  border-radius:999px;padding:8px 16px;background:var(--glass);border:1px solid var(--gb);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--sh);
}
#sq::placeholder{color:var(--mute)}
#leg{display:flex;flex-wrap:wrap;gap:5px}
.lg{
  font:inherit;font-size:11.5px;font-weight:500;color:var(--ink);
  border-radius:999px;padding:4px 10px;cursor:pointer;
  background:var(--glass);border:1px solid var(--gb);
  display:inline-flex;align-items:center;gap:5px;
}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lg[aria-pressed="false"]{opacity:.45;text-decoration:line-through}

/* Bottom Ask Bar */
#ask{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  width:min(680px,calc(100% - 24px));z-index:8;display:flex;flex-direction:column;gap:10px;
}
body.pn #ask{display:none}
#ans{border-radius:20px;padding:14px 18px;max-height:38vh;overflow:auto;box-shadow:var(--sh)}
#ans[hidden]{display:none}
#at{margin:0 0 10px;white-space:pre-wrap;font-size:14px;line-height:1.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px}
.chips button{flex:none;font-weight:500}
.row{display:flex;gap:8px}
.row input{
  flex:1;min-width:0;font:inherit;color:var(--ink);border-radius:999px;
  padding:12px 18px;box-shadow:var(--sh);
}
.row input::placeholder{color:var(--mute)}
.row .act{
  background:linear-gradient(135deg,#19e3ff,#8b5cff 55%,#ff2e93);
  color:#05061a;border:0;padding:10px 22px;box-shadow:0 0 22px rgba(139,92,255,.5);
}
.row .act:disabled{opacity:.5}

/* Side Detail Panel */
aside{
  position:fixed;top:14px;right:14px;bottom:14px;width:340px;max-width:calc(100% - 28px);
  border-radius:22px;box-shadow:var(--sh);overflow:auto;
  padding:20px;z-index:15;transform:translateX(115%);visibility:hidden;
  transition:transform .28s,visibility .28s;display:flex;flex-direction:column;gap:12px;
}
aside.open{transform:none;visibility:visible}
aside h2{font:600 20px/1.2 Sora,Inter,sans-serif;margin:0}
.badge{font-size:12.5px;color:var(--mute)}
pre{
  font:12px/1.65 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.2);
  border:1px solid var(--gb);border-radius:12px;padding:12px;margin:0;white-space:pre-wrap;
}

/* Modal Login / Register */
.modal-overlay{
  position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;
  padding:18px;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s;
}
.modal-overlay.open{visibility:visible;opacity:1}
.modal-box{width:min(400px,100%);border-radius:24px;padding:24px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:14px}
.modal-tabs{display:flex;gap:8px;border-bottom:1px solid var(--gb);padding-bottom:8px}
.modal-tab{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:4px 10px}
.modal-tab.active{color:var(--lnk);font-weight:600;border-bottom:2px solid var(--lnk)}
.modal-err{font-size:13px;color:#ff6b8b;background:rgba(255,46,147,.12);padding:8px 12px;border-radius:8px;border:1px solid rgba(255,46,147,.3);display:none}
.fm label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.fm input{
  width:100%;font:inherit;color:var(--ink);background:rgba(0,0,0,.25);
  border:1px solid var(--gb);border-radius:12px;padding:10px 14px;outline:none;
}
.fm input:focus{border-color:var(--lnk)}

@media (max-width:720px){
  #tools{top:calc(env(safe-area-inset-top,0px) + 65px)}
  aside{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-width:none;max-height:60%;transform:translateY(115%)}
  aside.open{transform:none}
  #chips{display:none}
}
</style>
</head>
<body>

<canvas id="c" aria-label="Graf ruang 3D Galaxy AI"></canvas>

<!-- Header Bersih: Hanya Login/Register, Layar Penuh, Hentikan Gerak -->
<header>
  <h1>Galaxy AI Agent</h1>
  <div class="bar">
    <button class="act auth-pill" id="authBtn">Masuk / Akun</button>
    <button class="act" id="fsc" title="Layar penuh">Layar penuh</button>
    <button class="act" id="mot" aria-pressed="true">Hentikan gerak</button>
  </div>
</header>

<!-- Filter Kategori & Pencarian Bubble -->
<div id="tools">
  <input id="sq" type="search" placeholder="Cari bubble…" autocomplete="off">
  <div id="leg"></div>
</div>

<!-- Panel Detail Bubble -->
<aside id="panel" aria-live="polite"></aside>

<!-- Bilah Bawah Tanya Galaxy AI -->
<div id="ask">
  <div id="ans" hidden>
    <p id="at"></p>
    <div style="display:flex;justify-content:flex-end;">
      <button class="act sm" id="ax">Tutup jawaban</button>

  </div>
  <div id="qrow">
    <div class="chips" id="chips"></div>
    <div class="row">
      <input id="q" placeholder="Tanyakan apa saja kepada Galaxy AI..." aria-label="Pertanyaan">
      <button class="act" id="go">Tanya</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="authModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font:600 19px Sora,sans-serif;margin:0;">Akun Galaxy AI</h2>
      <button class="act sm" id="closeAuthModal">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tabLogin">Masuk</button>
      <button class="modal-tab" id="tabRegister">Daftar</button>
    </div>
    <div class="modal-err" id="modalErr"></div>
    <div id="authFormArea">
      <div class="fm">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" placeholder="nama@email.com">
        <label for="authPassword">Kata Sandi</label>
        <input type="password" id="authPassword" placeholder="Minimal 6 karakter">
      </div>
      <div style="margin-top:16px;display:flex;justify-content:flex-end;">
        <button class="act primary" id="authSubmitBtn">Masuk</button>
      </div>
    </div>
    <div id="loggedInArea" style="display:none;">
      <p style="font-size:14px;margin:0 0 14px;" id="loggedInUserText">Anda sedang login.</p>
      <div style="display:flex;justify-content:flex-end;">
        <button class="act" id="logoutBtn">Keluar (Logout)</button>
      </div>
    </div>
  </div>
</div>

function size(){
  var w=innerWidth,h=innerHeight,o=rad0;
  R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(w,h,false);
  C.aspect=w/h;C.updateProjectionMatrix();
  rad0=M*(w/h<1?3.6:2.5);var r=rad0/o;radG*=r;rad*=r;
}
rad0=M*2.5;rad=radG=rad0;size();addEventListener("resize",size);

function frame(){
  requestAnimationFrame(frame);
  T++;
  if(mot&&!drag&&!sel&&!lit)th+=.0015;
  tgt.lerp(goal,.07);rad+=(radG-rad)*.07;
  C.position.set(tgt.x+rad*Math.sin(ph)*Math.cos(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.sin(th));C.lookAt(tgt);

  edges.forEach(function(e,i){
    for(var k=0;k<2;k++){
      var t=(T*.004+i*.137+k*.5)%1;
      d.copy(e.b.p).sub(e.a.p).multiplyScalar(t).add(e.a.p).toArray(pp,i*6+k*3);
      if(t>.985)e.b.pu=1;
    }
  });
  pg.attributes.position.needsUpdate=true;
  nodes.forEach(function(n){
    if(n.pu>.01){n.pu*=.93;var s=n.h*(1+n.pu*.3);n.spr.scale.set(s*n.ar,s,1)}
  });

  if(mot&&alpha>0){
    simStep();
    nodes.forEach(function(n){n.spr.position.copy(n.p)});
    edges.forEach(function(e,i){e.a.p.toArray(lp,i*6);e.b.p.toArray(lp,i*6+3)});
    lg.attributes.position.needsUpdate=true;
  }
  R.render(S,C);
}
frame();

// Interaksi Mouse & Sentuh (Termasuk Gestur Drag Node & Pinch-to-Zoom di HP)
var pts={},down=null,moved=0;
cv.addEventListener("pointerdown",function(ev){
  cv.setPointerCapture(ev.pointerId);pts[ev.pointerId]=[ev.clientX,ev.clientY];
  down=1;moved=0;drag=1;cv.style.cursor="grabbing";
  dn=null;pin=null;
  if(Object.keys(pts).length===1&&ev.button===0&&!ev.shiftKey){
    var hn=hitNode(ev);
    if(hn){dn=hn;startDrag(hn,ev)}
  }
});
cv.addEventListener("contextmenu",function(ev){ev.preventDefault()});
cv.addEventListener("pointermove",function(ev){
  var p=pts[ev.pointerId];if(!p)return;
  var ids=Object.keys(pts);
  if(ids.length===2){
    // Gestur 2 jari di HP: Pinch untuk Zoom In/Out & Dua Jari untuk Pan
    var o=pts[ids[0]==ev.pointerId?ids[1]:ids[0]],d1=Math.hypot(p[0]-o[0],p[1]-o[1]);
    panBy((ev.clientX-p[0])/2,(ev.clientY-p[1])/2);
    p[0]=ev.clientX;p[1]=ev.clientY;
    var d2=Math.hypot(p[0]-o[0],p[1]-o[1]);
    if(d2>0)radG=lim(radG*d1/d2);
    moved=9;
  }
  else{
    var dx=ev.clientX-p[0],dy=ev.clientY-p[1];
    moved+=Math.abs(dx)+Math.abs(dy);
    if(dn){
      // Gestur drag memindahkan bubble/node
      if(moved>6)dragNode(ev);
    }
    else if(ev.shiftKey||(ev.buttons&6)){
      panBy(dx,dy);
    }
    else{
      // Geser 1 jari untuk rotasi kamera 3D
      th+=dx*.006;ph=Math.min(3,Math.max(.15,ph-dy*.006));
    }
    p[0]=ev.clientX;p[1]=ev.clientY;
  }
});
function up(ev){
  delete pts[ev.pointerId];drag=Object.keys(pts).length>0;cv.style.cursor="grab";
  if(!drag){pin=null;dn=null}
  if(ev.type==="pointerup"&&moved<6&&down)pick(ev);
  down=null;
}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",function(ev){
  ev.preventDefault();radG=lim(radG*(1+ev.deltaY*.0012));
},{passive:false});

var ray=new THREE.Raycaster(),dn=null,pin=null,alpha=0,dplane=new THREE.Plane(),dhit=new V(),doff=new V();
function ndc(ev){return new THREE.Vector2(ev.clientX/innerWidth*2-1,-(ev.clientY/innerHeight)*2+1)}
function hitNode(ev){
  ray.setFromCamera(ndc(ev),C);
  var h=ray.intersectObjects(nodes.filter(vis).map(function(n){return n.spr}));
  return h.length?h[0].object.userData.n:null;
}
function startDrag(n,ev){
  var nv=new V();C.getWorldDirection(nv);dplane.setFromNormalAndCoplanarPoint(nv,n.p);
  ray.setFromCamera(ndc(ev),C);
  if(ray.ray.intersectPlane(dplane,dhit))doff.copy(n.p).sub(dhit);else doff.set(0,0,0);
}
function dragNode(ev){
  ray.setFromCamera(ndc(ev),C);
  if(!ray.ray.intersectPlane(dplane,dhit))return;
  pin=dn;dn.fx=true;dn.p.copy(dhit).add(doff);dn.f.set(0,0,0);alpha=1;
}
function panBy(dx,dy){
  var e=C.matrixWorld.elements,k=2*rad*Math.tan(25*Math.PI/180)/innerHeight,mx=-dx*k,my=dy*k,v=new V(e[0]*mx+e[4]*my,e[1]*mx+e[5]*my,e[2]*mx+e[6]*my);
  goal.add(v);tgt.add(v);
}
function simStep(){
  nodes.forEach(function(n){n.f.set(0,0,0)});
  for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){
    var a=nodes[i],b=nodes[j];d.copy(a.p).sub(b.p);var l=d.length()+.1;
    d.multiplyScalar(9000/(l*l)/l);a.f.add(d);b.f.sub(d);
  }
  edges.forEach(function(e){
    d.copy(e.b.p).sub(e.a.p);var l=d.length()+.1;
    d.multiplyScalar((l-110)*.05/l);e.a.f.add(d);e.b.f.sub(d);
  });
  nodes.forEach(function(n){
    if(n===pin||n.fx)return;
    n.f.addScaledVector(n.p,-.02);n.p.addScaledVector(n.f.clampLength(0,10),alpha);
  });
  alpha*=.965;if(alpha<.004)alpha=0;
}

function pick(ev){
  var t=hitNode(ev);
  select(t);
}

var pn=document.getElementById("panel");
function select(n){
  sel=n;lit=null;
  document.body.classList.toggle("pn",!!n);
  pn.classList.toggle("open",!!n);
  if(!n){goal.set(0,0,0);radG=rad0;paint();return}
  goal.copy(n.p);radG=rad0*.55;

  var pr=Object.keys(n.props).map(function(k){return k+": "+n.props[k]}).join("\n");
  pn.innerHTML='<button class="act sm" id="x" style="align-self:flex-end;">Tutup</button>'
    +'<h2>'+n.label+'</h2>'
    +'<div class="badge">'+(TYPES[n.type]?.n||n.type)+'</div>'
    +'<p style="margin:0;font-size:14px;">'+n.desc+'</p>'
    +(pr?'<pre>'+pr+'</pre>':'')
    +'<button class="act primary sm" id="askNodeBtn" style="margin-top:8px;">✦ Tanya Galaxy AI tentang ini</button>';

  document.getElementById("x").onclick=function(){select(null)};
  document.getElementById("askNodeBtn").onclick=function(){
    var q="Tolong jelaskan tentang "+n.label+" ("+n.desc+")";
    qi.value=q;ask(q);
  };
  paint();
}

// 3. TANYA GALAXY AI
// ==========================================================
var ans=document.getElementById("ans"),qi=document.getElementById("q"),go=document.getElementById("go"),busy=0;
function show(t){document.getElementById("at").textContent=t;ans.hidden=false}
document.getElementById("ax").onclick=function(){lit=null;ans.hidden=true;paint();goal.set(0,0,0);radG=rad0};

async function ask(q){
  q=q.trim();if(!q||busy)return;
  if(!currentUser||!currentToken){
    openAuthModal();
    showAuthErr("Silakan Masuk atau Daftarkan akun terlebih dahulu untuk berdialog.");
    return;
  }
  busy=1;go.disabled=true;select(null);show("Galaxy sedang berpikir...");
  try{
    var resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentToken},
      body:JSON.stringify({message:q})
    });
    var data=await resp.json();
    if(!resp.ok)throw new Error(data.error||"Gagal menghubungi server");
    show(data.reply);

    // Sorot node yang disebut
    var matched=[];
    nodes.forEach(function(n){
      if(data.reply.toLowerCase().indexOf(n.label.toLowerCase())>=0)matched.push(n.id);
    });
    if(matched.length){
      lit=matched.slice(0,6);paint();
      var c=new V();lit.forEach(function(i){if(byId[i])c.add(byId[i].p)});
      goal.copy(c.divideScalar(lit.length));radG=rad0*.75;
    }
  }catch(e){
    show("Terjadi kesalahan: "+e.message);
  }
  busy=0;go.disabled=false;
}

go.onclick=function(){ask(qi.value)};
qi.addEventListener("keydown",function(ev){if(ev.key==="Enter")ask(qi.value)});

["Proyek saat ini?","Jelaskan ekosistem Galaxy AI","Rencana Be A Leader"].forEach(function(t){
  var b=document.createElement("button");b.textContent=t;
  b.onclick=function(){qi.value=t;ask(t)};
  document.getElementById("chips").appendChild(b);
});

// Search & Legend
var sq=document.getElementById("sq");
sq.addEventListener("input",function(){
  var q=sq.value.trim().toLowerCase();
  if(!q){lit=null;paint();goal.set(0,0,0);radG=rad0;return}
  var m=nodes.filter(function(n){return !hid[n.type]&&(n.label+" "+n.desc).toLowerCase().indexOf(q)>=0});
  if(m.length){
    lit=m.map(function(n){return n.id});
    var c=new V();m.forEach(function(n){c.add(n.p)});
    goal.copy(c.divideScalar(m.length));radG=rad0*.75;
  }else lit=null;
  paint();
});

var leg=document.getElementById("leg");
Object.keys(TYPES).forEach(function(k){
  var b=document.createElement("button");b.className="lg";
  b.innerHTML='<i style="background:'+col(TYPES[k].v)+'"></i>'+TYPES[k].n;
  b.onclick=function(){hid[k]=!hid[k];b.setAttribute("aria-pressed",String(!hid[k]));paint()};
  leg.appendChild(b);
});

// ==========================================================
// 4. MODAL LOGIN & REGISTER SUPABASE
// ==========================================================
var authModal=document.getElementById("authModal");
var modalErr=document.getElementById("modalErr");

function openAuthModal(){
  authModal.classList.add("open");hideAuthErr();
  if(currentUser){
    document.getElementById("authFormArea").style.display="none";
    document.getElementById("loggedInArea").style.display="block";
    document.getElementById("loggedInUserText").innerHTML="Login sebagai: <strong>"+currentUser.email+"</strong>";
  }else{
    document.getElementById("authFormArea").style.display="block";
    document.getElementById("loggedInArea").style.display="none";
    setAuthTab("tabLogin");
  }
}
function closeAuthModal(){authModal.classList.remove("open")}
function showAuthErr(m){modalErr.textContent=m;modalErr.style.display="block"}
function hideAuthErr(){modalErr.style.display="none"}

function setAuthTab(tid){
  hideAuthErr();
  document.querySelectorAll(".modal-tab").forEach(function(t){t.classList.remove("active")});
  document.getElementById(tid).classList.add("active");
  document.getElementById("authSubmitBtn").textContent=(tid==="tabRegister"?"Daftar Akun":"Masuk");
}

document.getElementById("authBtn").onclick=openAuthModal;
document.getElementById("closeAuthModal").onclick=closeAuthModal;
document.getElementById("tabLogin").onclick=function(){setAuthTab("tabLogin")};
document.getElementById("tabRegister").onclick=function(){setAuthTab("tabRegister")};

document.getElementById("authSubmitBtn").onclick=async function(){
  if(!sbClient){showAuthErr("Koneksi belum siap.");return}
  var em=document.getElementById("authEmail").value.trim();
  var pw=document.getElementById("authPassword").value;
  if(!em||!pw){showAuthErr("Email dan kata sandi wajib diisi.");return}

  var isReg=document.getElementById("tabRegister").classList.contains("active");
  hideAuthErr();

  if(isReg){
    var r=await sbClient.auth.signUp({email:em,password:pw});
    if(r.error)showAuthErr(r.error.message);
    else{alert("Pendaftaran berhasil! Silakan langsung login.");setAuthTab("tabLogin")}
  }else{
    var r2=await sbClient.auth.signInWithPassword({email:em,password:pw});
    if(r2.error)showAuthErr(r2.error.message);
    else{
      currentUser=r2.data.user;currentToken=r2.data.session?r2.data.session.access_token:null;
      updateAuthBtn();closeAuthModal();
    }
  }
};

document.getElementById("logoutBtn").onclick=async function(){
  if(sbClient)await sbClient.auth.signOut();
  currentUser=null;currentToken=null;
  updateAuthBtn();closeAuthModal();
};

paint();
})();
</script>
